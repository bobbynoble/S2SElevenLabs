<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<title>Realtime Translate tester</title>
<style>
  body { font-family: system-ui, sans-serif; max-width: 720px; margin: 2rem auto; padding: 0 1rem; }
  h1 { font-size: 1.3rem; }
  .row { display: flex; gap: 0.75rem; align-items: center; margin-bottom: 1rem; }
  select { font-size: 1rem; padding: 0.4rem; }
  button#talk {
    font-size: 1.1rem; padding: 0.75rem 1.5rem; cursor: pointer;
    background: #2563eb; color: white; border: none; border-radius: 6px;
  }
  button#talk.active { background: #dc2626; }
  button#talk:disabled { background: #9ca3af; cursor: not-allowed; }
  .panel { border: 1px solid #d1d5db; border-radius: 6px; padding: 0.75rem 1rem; margin-bottom: 1rem; }
  .panel h2 { margin: 0 0 0.4rem; font-size: 0.85rem; text-transform: uppercase; color: #6b7280; }
  #partial { color: #6b7280; font-style: italic; }
  #final { font-weight: 600; }
  #translation { color: #1d4ed8; font-weight: 600; }
  #log {
    font-family: monospace; font-size: 0.8rem; white-space: pre-wrap;
    background: #111827; color: #d1fae5; padding: 0.75rem; border-radius: 6px;
    height: 320px; overflow-y: auto;
  }
  .status { font-size: 0.85rem; color: #6b7280; }
</style>
</head>
<body>
  <h1>Realtime Translate tester</h1>
  <p class="status">Standalone -- talks directly to ElevenLabs Realtime Translate via a thin relay, not the main app. Always translates from English.</p>

  <div class="row">
    <label for="lang">Target language</label>
    <select id="lang"></select>
    <button id="talk">Hold to talk</button>
    <span id="status" class="status"></span>
  </div>

  <div class="panel">
    <h2>Transcript (source, English)</h2>
    <div id="partial"></div>
    <div id="final"></div>
  </div>

  <div class="panel">
    <h2>Translation</h2>
    <div id="translation"></div>
  </div>

  <div class="panel">
    <h2>Event log (timestamped -- copy straight into a bug report)</h2>
    <div id="log"></div>
  </div>

<script>
const LANGUAGES = [
  ['pl', 'Polish'], ['ro', 'Romanian'], ['ar', 'Arabic'], ['pt', 'Portuguese'],
  ['es', 'Spanish'], ['fr', 'French'], ['zh', 'Mandarin Chinese'], ['tr', 'Turkish'],
  ['pa', 'Punjabi'], ['ur', 'Urdu'], ['bn', 'Bengali'], ['so', 'Somali'],
  ['fa', 'Farsi/Dari'], ['ps', 'Pashto'], ['vi', 'Vietnamese'], ['ti', 'Tigrinya'],
]

const langSelect = document.getElementById('lang')
for (const [code, name] of LANGUAGES) {
  const opt = document.createElement('option')
  opt.value = code
  opt.textContent = `${name} (${code})`
  langSelect.appendChild(opt)
}

const talkButton = document.getElementById('talk')
const statusEl = document.getElementById('status')
const partialEl = document.getElementById('partial')
const finalEl = document.getElementById('final')
const translationEl = document.getElementById('translation')
const logEl = document.getElementById('log')

function log(line) {
  const t = new Date().toISOString().split('T')[1].replace('Z', '')
  logEl.textContent += `${t}  ${line}\n`
  logEl.scrollTop = logEl.scrollHeight
}

// --- Playback: schedules raw 16-bit PCM chunks back-to-back as they arrive, same approach
// as the main app's useAudioPlayback.js -- no waiting for the whole reply before playing.
const SAMPLE_RATE = 16000
const audioContext = new (window.AudioContext || window.webkitAudioContext)()
let nextStartTime = 0

function playChunk(arrayBuffer) {
  const samples = new Int16Array(arrayBuffer)
  const floatSamples = new Float32Array(samples.length)
  for (let i = 0; i < samples.length; i++) floatSamples[i] = samples[i] / 32768
  const buffer = audioContext.createBuffer(1, floatSamples.length, SAMPLE_RATE)
  buffer.copyToChannel(floatSamples, 0)
  const source = audioContext.createBufferSource()
  source.buffer = buffer
  source.connect(audioContext.destination)
  const startAt = Math.max(nextStartTime, audioContext.currentTime)
  source.start(startAt)
  nextStartTime = startAt + buffer.duration
}

// --- Mic capture: same pattern as client/src/composables/useMicCapture.js, stripped down.
const CHUNK_FLUSH_MS = 200
let stream = null
let micContext = null
let workletNode = null
let sourceNode = null
let pendingSamples = []
let pendingSampleCount = 0
let flushTimer = null

function floatTo16BitPCM(floatSamples) {
  const buffer = new ArrayBuffer(floatSamples.length * 2)
  const view = new DataView(buffer)
  for (let i = 0; i < floatSamples.length; i++) {
    const clamped = Math.max(-1, Math.min(1, floatSamples[i]))
    view.setInt16(i * 2, clamped < 0 ? clamped * 0x8000 : clamped * 0x7fff, true)
  }
  return buffer
}

let ws = null

function flushPending() {
  if (pendingSampleCount === 0 || !ws || ws.readyState !== WebSocket.OPEN) return
  const merged = new Float32Array(pendingSampleCount)
  let offset = 0
  for (const chunk of pendingSamples) {
    merged.set(chunk, offset)
    offset += chunk.length
  }
  pendingSamples = []
  pendingSampleCount = 0
  ws.send(floatTo16BitPCM(merged))
}

async function startMic() {
  stream = await navigator.mediaDevices.getUserMedia({
    audio: { channelCount: 1, echoCancellation: true, noiseSuppression: true, autoGainControl: true },
  })
  micContext = new AudioContext({ sampleRate: SAMPLE_RATE })
  await micContext.audioWorklet.addModule('/static/pcm-capture-processor.js')
  sourceNode = micContext.createMediaStreamSource(stream)
  workletNode = new AudioWorkletNode(micContext, 'pcm-capture-processor')
  workletNode.port.onmessage = (event) => {
    pendingSamples.push(event.data)
    pendingSampleCount += event.data.length
  }
  sourceNode.connect(workletNode)
  flushTimer = setInterval(flushPending, CHUNK_FLUSH_MS)
}

function stopMic() {
  clearInterval(flushTimer)
  flushTimer = null
  flushPending()
  workletNode?.disconnect()
  sourceNode?.disconnect()
  workletNode = null
  sourceNode = null
  stream?.getTracks().forEach((t) => t.stop())
  stream = null
  micContext?.close()
  micContext = null
}

async function startTurn() {
  if (audioContext.state === 'suspended') await audioContext.resume()
  nextStartTime = audioContext.currentTime
  partialEl.textContent = ''
  finalEl.textContent = ''
  translationEl.textContent = ''

  const targetLanguage = langSelect.value
  ws = new WebSocket(`ws://${location.host}/ws?target_language=${targetLanguage}`)
  ws.binaryType = 'arraybuffer'

  ws.addEventListener('open', async () => {
    statusEl.textContent = `connected -- speak English, translating to ${targetLanguage}`
    log(`-- connected, target_language=${targetLanguage} --`)
    await startMic()
  })

  ws.addEventListener('message', (event) => {
    if (event.data instanceof ArrayBuffer) {
      playChunk(event.data)
      return
    }
    const msg = JSON.parse(event.data)
    log(JSON.stringify(msg))
    if (msg.message_type === 'partial_transcript') partialEl.textContent = msg.text || ''
    if (msg.message_type === 'final_transcript') {
      finalEl.textContent += (finalEl.textContent ? ' ' : '') + (msg.text || '')
      partialEl.textContent = ''
    }
    if (msg.message_type === 'translation') {
      translationEl.textContent += (translationEl.textContent ? ' ' : '') + (msg.text || '')
    }
    if (msg.error) statusEl.textContent = `error: ${msg.error}`
  })

  ws.addEventListener('close', () => {
    statusEl.textContent = 'session closed'
    log('-- session closed --')
  })

  ws.addEventListener('error', () => log('-- websocket error --'))
}

function endTurn() {
  stopMic()
  if (ws && ws.readyState === WebSocket.OPEN) {
    ws.send(JSON.stringify({ type: 'end' }))
  }
}

let active = false
async function press() {
  if (active) return
  active = true
  talkButton.classList.add('active')
  talkButton.textContent = 'Release to stop'
  langSelect.disabled = true
  await startTurn()
}
function release() {
  if (!active) return
  active = false
  talkButton.classList.remove('active')
  talkButton.textContent = 'Hold to talk'
  langSelect.disabled = false
  endTurn()
}

talkButton.addEventListener('mousedown', press)
talkButton.addEventListener('touchstart', (e) => { e.preventDefault(); press() })
talkButton.addEventListener('mouseup', release)
talkButton.addEventListener('mouseleave', () => { if (active) release() })
talkButton.addEventListener('touchend', release)
</script>
</body>
</html>
